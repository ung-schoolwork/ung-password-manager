# The Cloudflare tunnel controller creates the proxied passwords CNAME in the
# mediasave.llc zone; Cloudflare's edge certificate serves HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ung-site
  namespace: ung-password-manager
spec:
  ingressClassName: cloudflare-tunnel
  rules:
    - host: passwords.mediasave.llc
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ung-site
                port:
                  number: 3000
